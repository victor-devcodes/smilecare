<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmileCare Dental Clinic | Family & Cosmetic Dentist in Houston, TX</title>

    <meta name="description" content="SmileCare Dental Clinic provides trusted family, cosmetic, and emergency dental care in Houston, TX. Book an appointment for healthy, confident smiles today.">
    <meta name="keywords" content="dentist Houston, dental clinic, family dentist, cosmetic dentistry, teeth whitening, dental implants, emergency dentist">
    <meta name="author" content="SmileCare Dental Clinic">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="SmileCare Dental Clinic | Family & Cosmetic Dentist in Houston, TX">
    <meta property="og:description" content="Trusted family, cosmetic, and emergency dental care in Houston, TX. Book your appointment today.">
    <meta property="og:image" content="images/og-image.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.smilecare.com">

    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/appointment.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
    
    <body>

        <div class="form-logo">

            <a href="index.html" class="logo">
                    <span>SmileCare</span>
            </a>
        </div>
        <form class="contact-form" id="contactForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="John Doe"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="john@email.com"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+1 (555) 123-4567"
                    required>
            </div>

            <div class="form-group">

                <label for="service">

                    Select Service

                </label>

                <select id="service" name="service" required>

                    <option value="">Choose a Service</option>

                    <option>General Check-up</option>

                    <option>Teeth Cleaning</option>

                    <option>Teeth Whitening</option>

                    <option>Dental Implants</option>

                    <option>Braces & Orthodontics</option>

                    <option>Emergency Dental Care</option>

                </select>

            </div>

            <div class="form-group">

                <label for="date">

                    Preferred Appointment Date

                </label>

                <input
                    type="date"
                    id="date"
                    name="date">

            </div>

            <div class="form-group">

                <label for="message">

                    Message

                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Tell us how we can help..."></textarea>

            </div>

            <button class="btn" type="submit">

                Book Appointment

            </button>
            
        </form>

    </body>
</html>
